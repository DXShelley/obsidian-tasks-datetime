<div>
  <form class="tasks-modal">
    <section class="tasks-modal-description-section">
      <label for="description">
        Descrip
        <span class="accesskey">t</span>
        ion
      </label>
      <textarea
        id="description"
        class="tasks-modal-description"
        placeholder="Take out the trash"
        accesskey="t"></textarea>
    </section>
    <section class="tasks-modal-priority-section">
      <div id="priority" class="tasks-priority-matrix" role="group" aria-label="Importance and urgency">
        <div class="tasks-priority-title">Priority</div>
        <div class="tasks-priority-axis tasks-priority-axis-x">Urgency</div>
        <div class="tasks-priority-axis tasks-priority-axis-y">Importance</div>
        <div class="tasks-priority-grid">
          <button type="button" aria-pressed="false">Light / Slow</button>
          <button type="button" aria-pressed="false">Light / Normal</button>
          <button type="button" aria-pressed="false">Light / Urgent</button>
          <button type="button" aria-pressed="false">Normal / Slow</button>
          <button type="button" aria-pressed="true" class="tasks-priority-selected">Normal / Normal</button>
          <button type="button" aria-pressed="false">Normal / Urgent</button>
          <button type="button" aria-pressed="false">Heavy / Slow</button>
          <button type="button" aria-pressed="false">Heavy / Normal</button>
          <button type="button" aria-pressed="false">Heavy / Urgent</button>
        </div>
      </div>
    </section>
    <hr id="line-after-priority" />
    <section class="tasks-modal-dates-section">
      <label for="recurrence">
        <span class="accesskey">R</span>
        ecurs
      </label>
      <input
        id="recurrence"
        type="text"
        class="tasks-modal-date-input"
        placeholder="Try 'every day when done'"
        accesskey="r" />
      <select class="tasks-modal-recurrence-preset" aria-label="Common recurrence intervals">
        <option value="">Choose interval...</option>
        <option value="every 30 minutes">Every 30 minutes</option>
        <option value="every hour">Every hour</option>
        <option value="every day">Every day</option>
        <option value="every week">Every week</option>
        <option value="every month">Every month</option>
      </select>
      <code class="tasks-modal-parsed-date">
        🔁
        <i>not recurring</i>
      </code>
      <label for="due">
        <span class="accesskey">D</span>
        ue
      </label>
      <input
        id="due"
        type="text"
        class="tasks-modal-date-input"
        placeholder="Try 'Mon' or 'tm' then space"
        accesskey="d" />
      <div class="tasks-modal-parsed-date">
        📅
        <input class="tasks-modal-date-editor-picker" type="text" id="date-editor-picker" tabindex="-1" />
      </div>
      <label for="scheduled">
        <span class="accesskey">S</span>
        cheduled
      </label>
      <input
        id="scheduled"
        type="text"
        class="tasks-modal-date-input tasks-modal-error"
        placeholder="Try 'Mon' or 'tm' then space"
        accesskey="s" />
      <div class="tasks-modal-parsed-date">
        ⏳
        <input class="tasks-modal-date-editor-picker" type="text" id="date-editor-picker" tabindex="-1" />
      </div>
      <code class="tasks-modal-parsed-date">
        ⏳
        <i>invalid scheduled date</i>
      </code>
      <label for="start">
        St
        <span class="accesskey">a</span>
        rt
      </label>
      <input
        id="start"
        type="text"
        class="tasks-modal-date-input"
        placeholder="Try 'Mon' or 'tm' then space"
        accesskey="a" />
      <div class="tasks-modal-parsed-date">
        🛫
        <input class="tasks-modal-date-editor-picker" type="text" id="date-editor-picker" tabindex="-1" />
      </div>
      <div class="future-dates-only" id="only-future-dates">
        <label for="forwardOnly">
          Only
          <span class="accesskey">f</span>
          uture dates:
        </label>
        <input id="forwardOnly" type="checkbox" class="task-list-item-checkbox tasks-modal-checkbox" accesskey="f" />
      </div>
    </section>
    <hr id="line-after-happens-dates" />
    <section class="tasks-modal-dependencies-section">
      <label for="blockedBy">
        <span class="accesskey">B</span>
        efore this
      </label>
      <span>
        <input
          accesskey="b"
          id="before_this"
          class="tasks-modal-dependency-input"
          type="text"
          placeholder="Search for tasks that the task being edited depends on..." />
        <iframe
          style="
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 0;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
          "
          aria-hidden="true"
          tabindex="-1"
          src="about:blank"></iframe>
      </span>
      <label for="blocking">
        Aft
        <span class="accesskey">e</span>
        r this
      </label>
      <span>
        <input
          accesskey="e"
          id="after_this"
          class="tasks-modal-dependency-input"
          type="text"
          placeholder="Search for tasks that depend on this task being done..." />
        <iframe
          style="
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 0;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
          "
          aria-hidden="true"
          tabindex="-1"
          src="about:blank"></iframe>
      </span>
    </section>
    <hr id="line-after-dependencies" />
    <section class="tasks-modal-dates-section">
      <label for="status" id="status">
        Stat
        <span class="accesskey">u</span>
        s
      </label>
      <select id="status-type" class="status-editor-status-selector" accesskey="u">
        <option value=" ">Todo [ ]</option>
        <option value="/">In Progress [/]</option>
        <option value="x">Done [x]</option>
        <option value="-">Cancelled [-]</option>
      </select>
      <label for="created">
        <span class="accesskey">C</span>
        reated
      </label>
      <input
        id="created"
        type="text"
        class="tasks-modal-date-input"
        placeholder="Try 'Mon' or 'tm' then space"
        accesskey="c" />
      <div class="tasks-modal-parsed-date">
        ➕
        <input class="tasks-modal-date-editor-picker" type="text" id="date-editor-picker" tabindex="-1" />
      </div>
      <label for="done">
        Done (
        <span class="accesskey">x</span>
        )
      </label>
      <input
        id="done"
        type="text"
        class="tasks-modal-date-input"
        placeholder="Try 'Mon' or 'tm' then space"
        accesskey="x" />
      <div class="tasks-modal-parsed-date">
        ✅
        <input class="tasks-modal-date-editor-picker" type="text" id="date-editor-picker" tabindex="-1" />
      </div>
      <label for="cancelled">
        Cancelled (
        <span class="accesskey">-</span>
        )
      </label>
      <input
        id="cancelled"
        type="text"
        class="tasks-modal-date-input"
        placeholder="Try 'Mon' or 'tm' then space"
        accesskey="-" />
      <div class="tasks-modal-parsed-date">
        ❌
        <input class="tasks-modal-date-editor-picker" type="text" id="date-editor-picker" tabindex="-1" />
      </div>
    </section>
    <section class="tasks-modal-button-section">
      <button type="submit" class="mod-cta" disabled="">Apply</button>
      <button type="button">Cancel</button>
    </section>
  </form>
</div>
