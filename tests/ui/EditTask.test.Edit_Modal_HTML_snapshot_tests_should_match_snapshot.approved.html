<div>
  <form class="tasks-modal">
    <section class="tasks-modal-description-section">
      <label for="description">
        Descrip
        <span class="accesskey">t</span>
        ion
      </label>
      <textarea
        id="description"
        class="tasks-modal-description"
        placeholder="Take out the trash"
        accesskey="t"></textarea>
    </section>
    <section class="tasks-modal-priority-section">
      <div id="priority" class="tasks-priority-matrix" role="group" aria-label="Importance and urgency">
        <div class="tasks-priority-heading"><span>Priority</span></div>
        <div class="tasks-priority-quadrants">
          <button type="button" aria-pressed="false">Important / Urgent</button>
          <button type="button" aria-pressed="false">Important / Not urgent</button>
          <button type="button" aria-pressed="false">Not important / Urgent</button>
          <button type="button" aria-pressed="false">Not important / Not urgent</button>
        </div>
      </div>
    </section>
    <hr id="line-after-priority" />
    <section class="tasks-modal-dates-section">
      <label for="recurrence">
        <span class="accesskey">R</span>
        ecurs
      </label>
      <select id="recurrence" class="tasks-modal-recurrence-select" accesskey="r">
        <option value="">Does not recur</option>
        <option value="every 30 minutes">Every 30 minutes</option>
        <option value="every hour">Every hour</option>
        <option value="every day">Every day</option>
        <option value="every week">Every week</option>
        <option value="every month">Every month</option>
      </select>
      <label class="tasks-modal-recurrence-when-done" for="recurrence-when-done">
        <input id="recurrence-when-done" type="checkbox" disabled="" />
        When done
      </label>
      <label for="due">
        <span class="accesskey">D</span>
        ue
      </label>
      <div class="tasks-modal-date-control">
        <button id="due" type="button" class="tasks-modal-date-picker" accesskey="d">
          <span>📅 Choose date</span>
        </button>
      </div>
      <input id="date-editor-picker-due" class="tasks-modal-date-picker-input" tabindex="-1" aria-hidden="true" />
      <label for="scheduled">
        <span class="accesskey">S</span>
        cheduled
      </label>
      <div class="tasks-modal-date-control">
        <button id="scheduled" type="button" class="tasks-modal-date-picker tasks-modal-error" accesskey="s">
          <span>⏳ Choose date</span>
        </button>
      </div>
      <input id="date-editor-picker-scheduled" class="tasks-modal-date-picker-input" tabindex="-1" aria-hidden="true" />
      <code class="tasks-modal-parsed-date">
        ⏳
        <i>invalid scheduled date</i>
      </code>
      <label for="start">
        St
        <span class="accesskey">a</span>
        rt
      </label>
      <div class="tasks-modal-date-control">
        <button id="start" type="button" class="tasks-modal-date-picker" accesskey="a">
          <span>🛫 2024-01-01</span>
        </button>
        <button type="button" class="tasks-modal-date-clear clickable-icon" aria-label="Clear start date">×</button>
      </div>
      <input id="date-editor-picker-start" class="tasks-modal-date-picker-input" tabindex="-1" aria-hidden="true" />
      <div class="future-dates-only" id="only-future-dates">
        <label for="forwardOnly">
          Only
          <span class="accesskey">f</span>
          uture dates:
        </label>
        <input id="forwardOnly" type="checkbox" class="task-list-item-checkbox tasks-modal-checkbox" accesskey="f" />
      </div>
    </section>
    <hr id="line-after-happens-dates" />
    <section class="tasks-modal-dependencies-section">
      <label for="blockedBy">
        <span class="accesskey">B</span>
        efore this
      </label>
      <span>
        <input
          accesskey="b"
          id="before_this"
          class="tasks-modal-dependency-input"
          type="text"
          placeholder="Search for tasks that the task being edited depends on..." />
        <iframe
          style="
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 0;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
          "
          aria-hidden="true"
          tabindex="-1"
          src="about:blank"></iframe>
      </span>
      <label for="blocking">
        Aft
        <span class="accesskey">e</span>
        r this
      </label>
      <span>
        <input
          accesskey="e"
          id="after_this"
          class="tasks-modal-dependency-input"
          type="text"
          placeholder="Search for tasks that depend on this task being done..." />
        <iframe
          style="
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border: 0;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
          "
          aria-hidden="true"
          tabindex="-1"
          src="about:blank"></iframe>
      </span>
    </section>
    <hr id="line-after-dependencies" />
    <section class="tasks-modal-dates-section">
      <label for="status" id="status">
        Stat
        <span class="accesskey">u</span>
        s
      </label>
      <select id="status-type" class="status-editor-status-selector" accesskey="u">
        <option value=" ">Todo [ ]</option>
        <option value="/">In Progress [/]</option>
        <option value="x">Done [x]</option>
        <option value="-">Cancelled [-]</option>
      </select>
      <label for="created">
        <span class="accesskey">C</span>
        reated
      </label>
      <div class="tasks-modal-date-control">
        <button id="created" type="button" class="tasks-modal-date-picker" accesskey="c">
          <span>➕ Choose date</span>
        </button>
      </div>
      <input id="date-editor-picker-created" class="tasks-modal-date-picker-input" tabindex="-1" aria-hidden="true" />
      <label for="done">
        Done (
        <span class="accesskey">x</span>
        )
      </label>
      <div class="tasks-modal-date-control">
        <button id="done" type="button" class="tasks-modal-date-picker" accesskey="x">
          <span>✅ Choose date</span>
        </button>
      </div>
      <input id="date-editor-picker-done" class="tasks-modal-date-picker-input" tabindex="-1" aria-hidden="true" />
      <label for="cancelled">
        Cancelled (
        <span class="accesskey">-</span>
        )
      </label>
      <div class="tasks-modal-date-control">
        <button id="cancelled" type="button" class="tasks-modal-date-picker" accesskey="-">
          <span>❌ Choose date</span>
        </button>
      </div>
      <input id="date-editor-picker-cancelled" class="tasks-modal-date-picker-input" tabindex="-1" aria-hidden="true" />
    </section>
    <section class="tasks-modal-button-section">
      <button type="submit" class="mod-cta" disabled="">Apply</button>
      <button type="button">Cancel</button>
    </section>
  </form>
</div>
