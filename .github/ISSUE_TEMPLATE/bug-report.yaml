name: Bug Report
description: Report a reproducible problem in Tasks Datetime
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you start
        This repository supports **Tasks Datetime**, the independently maintained derivative with plugin ID `tasks-datetime`.
        Do not report issues from the upstream Obsidian Tasks plugin here unless they also reproduce in Tasks Datetime.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested the latest Tasks Datetime release from this repository.
          required: true
        - label: I searched existing Tasks Datetime issues before filing this report.
          required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide task lines and queries as text, not only screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Tasks Datetime version
      placeholder: 8.3.10
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: 1.8.7
    validations:
      required: true
