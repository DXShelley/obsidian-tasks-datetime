name: Feature Request
description: Suggest an improvement for Tasks Datetime
labels: ["type: enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests here apply to Tasks Datetime, not the upstream Obsidian Tasks plugin.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing Tasks Datetime issues before filing this request.
          required: true
        - label: This request does not imply affiliation with or support from the upstream project.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
